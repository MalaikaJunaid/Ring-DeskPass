name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      SAM_CLI_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            deployable/requirements.txt
            deployable/src/requirements.txt

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Install deployable dependencies
        run: python -m pip install -r deployable/requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run unit tests
        run: python -m unittest discover -s deployable/tests -v

      - name: Compile Python sources
        run: python -m compileall -q prototype deployable

      - name: Validate SAM template
        run: sam validate --lint --template-file deployable/template.yaml

      - name: Build ARM64 Lambda packages
        run: sam build --use-container --template-file deployable/template.yaml
